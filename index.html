<script>
        const csvFileName = "data_20260430110928招財進保.csv";

        // 1. 用 fetch 抓取原始二進位資料 (ArrayBuffer)，避開 GitHub 的強制編碼
        fetch(csvFileName)
            .then(response => {
                if (!response.ok) throw new Error("找不到檔案或網路錯誤");
                return response.arrayBuffer();
            })
            .then(buffer => {
                // 2. 手動強制使用 Big5 解碼
                const decoder = new TextDecoder('big5');
                const csvText = decoder.decode(buffer);

                // 3. 將解碼後正確的中文字串，交給 PapaParse 處理
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const data = results.data;
                        
                        if(data.length > 0) {
                            const columns = Object.keys(data[0]).map(function(key) {
                                return { title: key, data: key };
                            });

                            document.getElementById('loadingText').style.display = 'none';
                            document.getElementById('fundTable').style.display = 'table';

                            $('#fundTable').DataTable({
                                data: data,
                                columns: columns,
                                pageLength: 25,
                                order: [[ 11, 'desc' ]],
                                language: {
                                    url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/zh-HANT.json"
                                }
                            });
                        } else {
                            document.getElementById('loadingText').innerText = "CSV 檔案內似乎沒有資料哦！";
                        }
                    },
                    error: function(err) {
                        document.getElementById('loadingText').innerText = "解析失敗！請確認檔案內容格式。";
                        console.error("CSV 解析錯誤:", err);
                    }
                });
            })
            .catch(err => {
                document.getElementById('loadingText').innerText = "讀取檔案失敗！請確認檔名是否完全正確，或等候幾分鐘讓 GitHub Pages 更新。";
                console.error("Fetch 錯誤:", err);
            });
    </script>
